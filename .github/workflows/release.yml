name: Release

# Builds SchemeMode.zip: the mode jar, java-tree-sitter (with the Scheme-only
# Linux library), and a standalone Python with the fork's mewnala for each
# platform, so nothing has to be installed. Pushing a v* tag publishes it with
# SchemeMode.txt, which the Contribution Manager reads.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # the fork release whose mewnala wheels go in the zip (same as CppMode uses)
  LP_TAG: v0.0.8-fork.2
  # java-tree-sitter version (the jar in mode/ on your machine)
  TS_VERSION: 1.9.1

jobs:
  jar:
    name: Mode jar
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5

      - name: Processing 4.3 (pde and core jars)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/p.tgz" \
            https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-linux-x64.tgz
          mkdir "$RUNNER_TEMP/processing"
          tar xzf "$RUNNER_TEMP/p.tgz" -C "$RUNNER_TEMP/processing" --strip-components=1 \
            --wildcards '*/lib/pde.jar' '*/core/library/core.jar'
          echo "PROCESSING_DIR=$RUNNER_TEMP/processing" >> "$GITHUB_ENV"

      - name: Build
        run: |
          gradle jar modeLibs -PtsVersion="$TS_VERSION" --no-daemon
          mkdir -p mode
          cp build/libs/SchemeMode.jar build/mode/*.jar mode/
          ls -la mode

      # the Scheme-only tree-sitter library for Linux, swapped into the jar
      - name: Tree-sitter (Linux)
        run: bash native/build.sh

      - uses: actions/upload-artifact@v6
        with:
          name: mode
          path: |
            mode/
            resources/queries/

  # java-tree-sitter with only the Scheme grammar, for each platform; its own
  # jar has no Windows library, which is why there was no highlighting there
  tree-sitter:
    name: Tree-sitter (${{ matrix.plat }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   plat: linux-x86_64 }
          - { os: macos-latest,   plat: macos }
          - { os: windows-latest, plat: windows-x86_64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python native/build_ts.py "$TS_VERSION"
      - name: Build
        if: runner.os != 'Windows'
        run: python3 native/build_ts.py "$TS_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: ts-${{ matrix.plat }}
          path: native/${{ matrix.plat }}/

  python:
    name: Python (${{ matrix.plat }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   plat: linux-x86_64 }
          - { os: macos-latest,   plat: macos-aarch64 }
          - { os: windows-latest, plat: windows-x86_64 }
    steps:
      - uses: actions/checkout@v5

      - name: mewnala wheels from the fork release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$LP_TAG" -R llamasjc/libprocessing -p 'mewnala-*.whl' -D wheels && ls wheels

      - name: Python with mewnala
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/ci/bundle_python.py ${{ matrix.plat }} wheels python

      - name: Linux libraries mewnala loads
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q libx11-6 libxcursor1 libxrandr2 libxi6 libxkbcommon0 libwayland-client0

      - name: Smoke test (import mewnala)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then PY=python/${{ matrix.plat }}/python.exe; else PY=python/${{ matrix.plat }}/bin/python3; fi
          "$PY" -c "import mewnala, sys; print('mewnala ok on', sys.version.split()[0])"

      - uses: actions/upload-artifact@v6
        with:
          name: python-${{ matrix.plat }}
          path: python/

  release:
    name: Release
    needs: [jar, python, tree-sitter]
    # a platform whose Python failed is left out; the others still ship
    if: ${{ always() && needs.jar.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: mode
          path: .

      - uses: actions/download-artifact@v6
        with:
          pattern: python-*
          path: python
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          pattern: ts-*
          path: ts

      # the version: prettyVersion from the tag (v1.2.3 -> 1.2.3), and version
      # one more than the latest published release's (the number the
      # Contribution Manager compares). The same tag built again keeps its number.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF_NAME#v}
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          PREV=$(gh release download --repo "$GITHUB_REPOSITORY" --pattern 'SchemeMode.txt' --output - 2>/dev/null | sed -n 's/^version=//p' | tr -d '\r ')
          if [ -z "$PREV" ]; then N=$(sed -n 's/^version=//p' mode.properties | tr -d '\r '); N=${N:-1}
          elif [ "$LATEST" = "$GITHUB_REF_NAME" ]; then N=$PREV
          else N=$((PREV + 1)); fi
          echo "version $V, number $N (latest release: ${LATEST:-none}, its number: ${PREV:-none})"
          for f in mode.properties SchemeMode.txt; do
            [ -f "$f" ] || continue
            sed -i -e "s/^prettyVersion=.*/prettyVersion=$V/" -e "s/^version=.*/version=$N/" "$f"
          done

      - name: Zip
        run: |
          rm -rf dist && mkdir -p dist/SchemeMode
          cp -r mode resources examples keywords.txt mode.properties dist/SchemeMode/
          [ -d python ] && cp -r python dist/SchemeMode/
          # the tree-sitter libraries: native/<platform>/
          for d in ts/ts-*; do [ -d "$d" ] && mkdir -p dist/SchemeMode/native/"${d#ts/ts-}" && cp -r "$d"/. dist/SchemeMode/native/"${d#ts/ts-}"/; done
          ls -R dist/SchemeMode/native 2>/dev/null | head -20
          [ -f LICENSE ] && cp LICENSE dist/SchemeMode/ || true
          # no -y: symlinks are stored as the files they point to, because
          # Processing's unzip doesn't make symlinks
          (cd dist && zip -qr SchemeMode.zip SchemeMode)
          ls -lh dist/SchemeMode.zip
          ls dist/SchemeMode/python 2>/dev/null || echo "no Python bundled"

      - uses: actions/upload-artifact@v6
        with:
          name: SchemeMode-zip
          path: dist/SchemeMode.zip

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a draft first, published with: gh release edit <tag> --draft=false
          # (repository variable RELEASE_DIRECT=true publishes right away)
          DRAFT=--draft; [ "${{ vars.RELEASE_DIRECT }}" = true ] && DRAFT=
          files="dist/SchemeMode.zip SchemeMode.txt"
          notes="release-notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # up under a temporary name first; the old file goes only once the new one is there
            for f in $files; do
              n=$(basename "$f"); tmp="new-$n"; cp "$f" "$RUNNER_TEMP/$tmp"
              gh release delete-asset "$GITHUB_REF_NAME" "$tmp" -y 2>/dev/null || true
              gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$tmp"
              old=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q ".assets[] | select(.name==\"$n\") | .apiUrl")
              [ -n "$old" ] && gh api -X DELETE "$old"
              new=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q ".assets[] | select(.name==\"$tmp\") | .apiUrl")
              gh api -X PATCH "$new" -f name="$n" >/dev/null
            done
            [ -f "$notes" ] && gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" $files --title "Scheme Mode ${GITHUB_REF_NAME#v}" --notes-file "$notes" $DRAFT
          else
            gh release create "$GITHUB_REF_NAME" $files --title "Scheme Mode ${GITHUB_REF_NAME#v}" --generate-notes $DRAFT
          fi
